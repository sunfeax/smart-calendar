<h2 mat-dialog-title>{{ data.title }}</h2>

@if (data.message) {
  <mat-dialog-content>
    <p class="confirm__message">{{ data.message }}</p>
  </mat-dialog-content>
}

<mat-dialog-actions align="end">
  <button matButton="text" type="button" [mat-dialog-close]="false">
    {{ data.cancelText ?? ('common.cancel' | transloco) }}
  </button>
  <button
    matButton="filled"
    type="button"
    [class]="confirmClass"
    [mat-dialog-close]="true"
  >
    {{ data.confirmText ?? ('common.confirm' | transloco) }}
  </button>
</mat-dialog-actions>
