<nav class="sidebar">
  <a
    class="sidebar__brand"
    [routerLink]="routePaths.calendars"
    [attr.aria-label]="'app.name' | transloco"
    [matTooltip]="'app.name' | transloco"
    matTooltipPosition="right"
  >
    <img
      class="sidebar__logo"
      src="brand/smart-calendar.svg"
      alt=""
      width="40"
      height="40"
    />
  </a>

  <div class="sidebar__actions">
    <button
      matIconButton
      type="button"
      [attr.aria-label]="themeLabel() | transloco"
      [matTooltip]="themeLabel() | transloco"
      matTooltipPosition="right"
      (click)="toggleTheme()"
    >
      <mat-icon>
        {{ themeService.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}
      </mat-icon>
    </button>

    <button
      type="button"
      class="sidebar__avatar"
      [matMenuTriggerFor]="menu"
      [attr.aria-label]="'sidebar.userMenu' | transloco"
    >
      @if (user()?.avatarUrl; as avatarUrl) {
        <img
          class="sidebar__avatar-img"
          [src]="avatarUrl"
          [alt]="user()?.name ?? ''"
          referrerpolicy="no-referrer"
        />
      } @else {
        {{ user()?.name?.charAt(0) }}
      }
    </button>
  </div>

  <mat-menu #langMenu="matMenu" xPosition="after" yPosition="above">
    @for (lang of languages; track lang) {
      <button mat-menu-item type="button" (click)="setLanguage(lang)">
        @if (language.lang() === lang) {
          <mat-icon>check</mat-icon>
        }
        <span>{{ languageNames[lang] }}</span>
      </button>
    }
  </mat-menu>

  <mat-menu #menu="matMenu" xPosition="after" yPosition="above">
    @if (user(); as currentUser) {
      <div class="sidebar__user">
        <span>{{ currentUser.name }}</span>
        <span>{{ currentUser.email }}</span>
      </div>
    }

    <button mat-menu-item type="button" [matMenuTriggerFor]="langMenu">
      <mat-icon>translate</mat-icon>
      <span>{{ 'sidebar.language' | transloco }}</span>
    </button>

    <button mat-menu-item type="button" (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>{{ 'sidebar.logout' | transloco }}</span>
    </button>
  </mat-menu>
</nav>
