<section class="login" aria-labelledby="login-heading">
  <p class="login__eyebrow">{{ 'auth.welcome' | transloco }}</p>
  <h2 id="login-heading" class="login__heading">{{ 'auth.signInTitle' | transloco }}</h2>
  <p class="login__description">{{ 'auth.signInDescription' | transloco }}</p>

  @if (loadFailed()) {
    <p class="login__status" role="status">{{ 'auth.googleScriptError' | transloco }}</p>
  } @else {
    <div class="login__action">
      <div class="login__face" aria-hidden="true">
        <img src="brand/google.svg" alt="" width="18" height="18" />
        {{ 'auth.continueWithGoogle' | transloco }}
      </div>
      <div #googleButton class="login__overlay"></div>
    </div>
  }
</section>
