<section>
  @for (calendar of calendars.hasValue() ? calendars.value() : []; track calendar.id) {
    <app-calendar-card
      [calendar]="calendar"
      (edit)="edit(calendar)"
      (remove)="delete(calendar.id)"
    ></app-calendar-card>
  }
  <app-calendar-add-card (add)="createRequest()"></app-calendar-add-card>
</section>
