<article class="calendar-card">
  <a class="calendar-card__link" [routerLink]="[routePaths.calendars, calendar().id]">
    {{ calendar().name || ('calendars.unnamed' | transloco) }}
  </a>

  <span class="calendar-card__role" [class.calendar-card__role--owner]="isOwner()">
    <mat-icon>{{ roleIcon() }}</mat-icon>
    {{ 'share.roles.' + calendar().role | transloco }}
  </span>

  @if (isOwner()) {
    <div class="calendar-card__actions">
      <button
        matIconButton
        type="button"
        [attr.aria-label]="'calendars.edit' | transloco"
        (click)="edit.emit()"
      >
        <mat-icon>edit</mat-icon>
      </button>

      <button
        matIconButton
        type="button"
        [attr.aria-label]="'calendars.delete' | transloco"
        (click)="remove.emit()"
      >
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  } @else {
    <div class="calendar-card__actions">
      <button
        matIconButton
        type="button"
        [attr.aria-label]="'share.leave' | transloco"
        (click)="leave.emit()"
      >
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  }
</article>
