<div cdkOverlayOrigin #origin="cdkOverlayOrigin" class="picker__trigger">
  @if (icon(); as current) {
    <button
      #triggerButton
      type="button"
      class="picker__current"
      [disabled]="!editable()"
      aria-haspopup="dialog"
      [attr.aria-expanded]="opened()"
      [attr.aria-controls]="opened() ? dialogId : null"
      [attr.aria-label]="'event.icon.change' | transloco"
      (click)="open()"
    >
      <app-event-icon [icon]="current" />
    </button>
  } @else if (editable()) {
    <button
      #triggerButton
      matButton
      type="button"
      class="picker__add"
      aria-haspopup="dialog"
      [attr.aria-expanded]="opened()"
      [attr.aria-controls]="opened() ? dialogId : null"
      (click)="open()"
    >
      <mat-icon>add_reaction</mat-icon>
      {{ 'event.icon.add' | transloco }}
    </button>
  }
</div>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="opened()"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  [cdkConnectedOverlayDisableClose]="true"
  [cdkConnectedOverlayViewportMargin]="16"
  [cdkConnectedOverlayPush]="true"
  (backdropClick)="close()"
  (detach)="opened.set(false)"
>
  <section
    class="picker"
    role="dialog"
    aria-modal="true"
    [id]="dialogId"
    [attr.aria-label]="'event.icon.title' | transloco"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    (keydown.escape)="close($event)"
  >
    <div class="picker__header">
      <span class="picker__title">{{ 'event.icon.title' | transloco }}</span>
      @if (icon()) {
        <button
          matIconButton
          type="button"
          class="picker__remove"
          [attr.aria-label]="'event.icon.remove' | transloco"
          (click)="choose(null)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      }
    </div>

    <p class="picker__caption">{{ 'event.icon.frequent' | transloco }}</p>
    <div class="picker__quick">
      @for (item of quickIcons(); track item.icon) {
        <button
          type="button"
          class="picker__quick-icon"
          [attr.aria-label]="item.label"
          (click)="choose(item.icon)"
        >
          <app-event-icon [icon]="item.icon" />
        </button>
      }
    </div>

    <div
      class="picker__sources"
      role="group"
      [attr.aria-label]="'event.icon.source' | transloco"
    >
      <button
        type="button"
        [attr.aria-pressed]="inputKind() === 'site'"
        (click)="setKind('site')"
      >
        {{ 'event.icon.site' | transloco }}
      </button>
      <button
        type="button"
        [attr.aria-pressed]="inputKind() === 'image'"
        (click)="setKind('image')"
      >
        {{ 'event.icon.image' | transloco }}
      </button>
    </div>

    <form
      class="picker__field"
      [class.picker__field--invalid]="invalid()"
      (submit)="submit($event)"
    >
      <input
        cdkFocusInitial
        #field
        class="picker__input"
        [attr.aria-label]="inputLabelKey() | transloco"
        [attr.aria-invalid]="invalid()"
        [attr.aria-describedby]="hintId"
        [placeholder]="placeholderKey() | transloco"
        [maxLength]="urlMax"
        [value]="query()"
        (input)="setQuery(field.value)"
      />
      <span class="picker__preview" aria-hidden="true">
        @if (candidate(); as preview) {
          <app-event-icon [icon]="preview" />
        }
      </span>
      <button
        matIconButton
        class="picker__apply"
        type="submit"
        [attr.aria-label]="'event.icon.apply' | transloco"
      >
        <mat-icon>check</mat-icon>
      </button>
    </form>
    <p
      class="picker__hint"
      [id]="hintId"
      [class.picker__hint--error]="invalid()"
      aria-live="polite"
    >
      {{ hintKey() | transloco }}
    </p>
  </section>
</ng-template>
