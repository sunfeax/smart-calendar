<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Smart Calendar</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f0b17" />
    <link rel="icon" type="image/svg+xml" href="brand/smart-calendar.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <style>
      .splash {
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 24px;
        min-height: 100svh;
        background: var(--color-background, #191919);
      }
      .splash__spinner {
        width: 32px;
        height: 32px;
        border: 4px solid transparent;
        border-top-color: var(--color-primary, #b89aff);
        border-radius: 50%;
        animation: splash-spin 1s linear infinite;
      }
      .splash__retry {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border: 1px solid var(--color-border, #4a4a4a);
        border-radius: 50%;
        color: var(--color-text, #eeeeee);
        animation: splash-retry-in 300ms ease 30s backwards;
      }
      @keyframes splash-retry-in {
        from {
          opacity: 0;
          visibility: hidden;
        }
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="splash" role="status" aria-label="Loading">
        <div class="splash__spinner"></div>
        <a class="splash__retry" href="/" aria-label="Retry" title="Retry">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"
            />
          </svg>
        </a>
      </div>
    </app-root>
  </body>
</html>
