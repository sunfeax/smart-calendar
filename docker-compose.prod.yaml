name: smart-calendar-prod

x-database-url: &database-url postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@smart-calendar-db:5432/${POSTGRES_DB}?schema=public

services:
  smart-calendar-db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  smart-calendar-migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: build
    environment:
      DATABASE_URL: *database-url
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on:
      smart-calendar-db:
        condition: service_healthy
    restart: 'no'

  smart-calendar-backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      PORT: 3000
    depends_on:
      smart-calendar-migrate:
        condition: service_completed_successfully

  smart-calendar-web:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - smart-calendar-backend
    networks:
      - default
      - web

networks:
  web:
    external: true

volumes:
  db-data:
